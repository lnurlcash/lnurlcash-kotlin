name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      # the mock mint is a Node process from the conformance repo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # actions/checkout refuses any path outside the workspace, so the two
      # sibling repos live inside it and every consumer is pointed at them
      # explicitly (build-core.sh and generate-bindings.sh both read
      # LNURLCASH_CORE; the test task reads LNURLCASH_CONFORMANCE).
      - uses: actions/checkout@v4
        with:
          repository: TheCryptoDonkey/lnurlcash-core
          path: core
      - uses: actions/checkout@v4
        with:
          repository: TheCryptoDonkey/lnurlcash-conformance
          path: conformance
      # the mock mint is a Node process with its own dependencies - without
      # these the adversarial suite cannot start it
      - run: npm ci
        working-directory: conformance
      - name: build the native core
        run: ./scripts/build-core.sh
        env:
          LNURLCASH_CORE: ${{ github.workspace }}/core
      # the bindings are checked in, so a hand edit must fail the build rather
      # than quietly become the truth
      - name: bindings are unmodified
        run: |
          ./scripts/generate-bindings.sh
          git diff --exit-code bindings/
        env:
          LNURLCASH_CORE: ${{ github.workspace }}/core
      - run: gradle build "-Djna.library.path=${{ github.workspace }}/core/target/release"
        env:
          LNURLCASH_CONFORMANCE: ${{ github.workspace }}/conformance

  # The aar is assembled by hand rather than by the Android Gradle Plugin, so
  # nothing about it is correct by construction. This job is what establishes
  # that it is correct anyway: a real consumer project resolves it by
  # coordinate, AGP accepts the format, the natives land in an APK, and the
  # instrumented tests run the FFI on an actual Android runtime against the
  # shared conformance vectors.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: actions/checkout@v4
        with:
          repository: TheCryptoDonkey/lnurlcash-core
          path: core

      - name: build the core for every Android ABI
        run: ./scripts/build-android-core.sh
        env:
          LNURLCASH_CORE: ${{ github.workspace }}/core

      - name: publish the aar where the consumer project can resolve it
        run: gradle :lnurlcash-kotlin-android:publishToMavenLocal

      # The emulator needs hardware acceleration, which the runner exposes only
      # once /dev/kvm is world-writable.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: run the FFI on a real Android runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          disable-animations: true
          script: cd android-verify && ./gradlew connectedDebugAndroidTest

      - name: the natives really are in the APK
        run: |
          apk=$(find android-verify/build/outputs/apk -name '*.apk' | head -1)
          echo "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$apk" | grep -q "lib/$abi/liblnurlcash_core.so" \
              || { echo "no core for $abi in the apk" >&2; exit 1; }
          done
          echo "all four ABIs present"
