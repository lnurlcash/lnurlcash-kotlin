name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      # the mock mint is a Node process from the conformance repo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # actions/checkout refuses any path outside the workspace, so the two
      # sibling repos live inside it and every consumer is pointed at them
      # explicitly (build-core.sh and generate-bindings.sh both read
      # LNURLCASH_CORE; the test task reads LNURLCASH_CONFORMANCE).
      - uses: actions/checkout@v4
        with:
          repository: TheCryptoDonkey/lnurlcash-core
          path: core
      - uses: actions/checkout@v4
        with:
          repository: TheCryptoDonkey/lnurlcash-conformance
          path: conformance
      - name: build the native core
        run: ./scripts/build-core.sh
        env:
          LNURLCASH_CORE: ${{ github.workspace }}/core
      # the bindings are checked in, so a hand edit must fail the build rather
      # than quietly become the truth
      - name: bindings are unmodified
        run: |
          ./scripts/generate-bindings.sh
          git diff --exit-code bindings/
        env:
          LNURLCASH_CORE: ${{ github.workspace }}/core
      - run: gradle build "-Djna.library.path=${{ github.workspace }}/core/target/release"
        env:
          LNURLCASH_CONFORMANCE: ${{ github.workspace }}/conformance
