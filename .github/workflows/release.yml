name: release

# Publishes to Maven Central through the Portal API.
#
# The hard part of this release is not the upload, it is that the jar carries
# compiled machine code. Five natives are built on five runners, and the whole
# set has to come from ONE commit of lnurlcash-core - the same commit the
# checked-in UniFFI bindings were generated from. A binding that disagrees with
# the library it calls is undefined behaviour on a money path, and nothing
# downstream would notice. So core.sha pins the core, every native is built
# from it, and the assemble job regenerates the bindings and fails if they
# differ by a byte from what is committed.
#
# Default is USER_MANAGED: the deployment lands VALIDATED and waits for a human
# to press publish. A version on Central is permanent and cannot be replaced,
# so the last step stays deliberate.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publishing-type:
        description: USER_MANAGED holds for review, AUTOMATIC releases immediately and permanently
        type: choice
        options: [USER_MANAGED, AUTOMATIC]
        default: USER_MANAGED
        required: true

permissions:
  contents: read

jobs:
  # The pin is read once and passed on, so every job in the release is provably
  # looking at the same core commit.
  pin:
    runs-on: ubuntu-latest
    outputs:
      core-sha: ${{ steps.read.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          sha=$(tr -d '[:space:]' < core.sha)
          [ ${#sha} -eq 40 ] || { echo "core.sha must be a full 40-character commit SHA, got '$sha'" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pinned lnurlcash-core at $sha"

  natives:
    needs: pin
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc is forward compatible and not backward compatible, so the
          # oldest runner available sets the floor for every consumer. 22.04
          # is glibc 2.35.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            prefix: linux-x86-64
            library: liblnurlcash_core.so
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            prefix: linux-aarch64
            library: liblnurlcash_core.so
          - runner: macos-15
            target: aarch64-apple-darwin
            prefix: darwin-aarch64
            library: liblnurlcash_core.dylib
            deployment-target: '11.0'
          # Cross-built from the arm runner. macOS ships both slices of the
          # SDK, so this is an ordinary build, not a cross-compilation problem.
          - runner: macos-15
            target: x86_64-apple-darwin
            prefix: darwin-x86-64
            library: liblnurlcash_core.dylib
            deployment-target: '10.13'
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            prefix: win32-x86-64
            library: lnurlcash_core.dll
            # Without a static CRT the DLL needs the Visual C++ redistributable
            # on the consumer's machine, which is not a thing a Kotlin library
            # gets to ask for.
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TheCryptoDonkey/lnurlcash-core
          ref: ${{ needs.pin.outputs.core-sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build the native core
        shell: bash
        run: cargo build --release --features ffi --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
      - name: stage it under the JNA resource prefix
        shell: bash
        run: |
          mkdir -p "natives/${{ matrix.prefix }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
             "natives/${{ matrix.prefix }}/${{ matrix.library }}"
          ls -l "natives/${{ matrix.prefix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.prefix }}
          path: natives/${{ matrix.prefix }}/${{ matrix.library }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [pin, natives]
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: collect every native
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
      # download-artifact gives each artifact its own directory named after the
      # artifact, which is already `native-<prefix>` - rename to the bare
      # prefix JNA looks for.
      - name: lay them out as JNA expects
        run: |
          for dir in natives/native-*; do
            mv "$dir" "natives/$(basename "$dir" | sed 's/^native-//')"
          done
          find natives -type f -exec ls -l {} +

      # The natives and the checked-in bindings must come from one core commit.
      # This is the gate that proves it: regenerate against the pinned core and
      # fail on any difference.
      - uses: actions/checkout@v4
        with:
          repository: TheCryptoDonkey/lnurlcash-core
          ref: ${{ needs.pin.outputs.core-sha }}
          path: core
      - name: bindings match the pinned core
        run: |
          ./scripts/generate-bindings.sh
          git diff --exit-code bindings/
        env:
          LNURLCASH_CORE: ${{ github.workspace }}/core

      - name: assemble the deployment
        run: gradle publishAllPublicationsToStagingRepository
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: upload to Central
        run: ./scripts/publish-central.sh
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          PUBLISHING_TYPE: ${{ inputs.publishing-type || 'USER_MANAGED' }}
