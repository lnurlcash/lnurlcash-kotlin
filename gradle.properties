org.gradle.jvmargs=-Xmx2g
kotlin.code.style=official

# The Kotlin plugin otherwise adds a kotlin-stdlib matching ITS version, which
# for a published library is a dependency on the toolchain that happened to
# build it. Gradle resolves to the highest version, so a stdlib 2.4.10 here
# drags every consumer's stdlib up to 2.4.10 too - and a consumer's Kotlin 2.2
# compiler cannot read 2.4 metadata, so the library simply will not compile for
# them. Declared explicitly at the floor instead; see build.gradle.kts.
kotlin.stdlib.default.dependency=false
